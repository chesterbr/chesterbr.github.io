name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Job-level, not step-level: bundler-cache's install and the later
      # `bundle exec jekyll build` step both need to see this, or the
      # build step fails looking for gems that were deliberately skipped.
      BUNDLE_WITHOUT: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Static search index. Runs against the built HTML (after Jekyll, before
      # upload) and writes _site/pagefind/, so results come from our own posts
      # instead of whatever a web crawler happened to index. Version pinned.
      # --force-language builds ONE index for the whole bilingual site so a
      # search from any page returns matches across pt-BR and English posts,
      # rather than being restricted to the current page's language.
      #
      # Legacy posts keep a redirect stub at their old literal ".html"
      # permalink; Pagefind's crawler mistakes that stub directory for a file
      # and logs "Is a directory" for it, which is harmless and filtered from
      # the log below. The indexed-page count is what actually guards against
      # a real post silently going missing from search: it must be at least
      # the number of posts in _posts, or the build fails instead of quietly
      # shipping a search index with content missing.
      - name: Index with Pagefind
        run: |
          POST_COUNT=$(find _posts -maxdepth 1 -name '*.md' | wc -l | tr -d ' ')
          PAGEFIND_LOG=$(mktemp)
          npx -y pagefind@1.5.2 --site _site --force-language pt > "$PAGEFIND_LOG" 2>&1 || true
          grep -v "Is a directory (os error 21)" "$PAGEFIND_LOG" || true
          INDEXED=$(grep -oE "Indexed [0-9]+ pages" "$PAGEFIND_LOG" | tail -1 | grep -oE "[0-9]+" || true)
          if [ -z "$INDEXED" ] || [ "$INDEXED" -lt "$POST_COUNT" ]; then
            echo "::error::Pagefind indexed only ${INDEXED:-0} pages, expected at least $POST_COUNT - some posts are missing from search."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
