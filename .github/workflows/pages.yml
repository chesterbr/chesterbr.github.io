name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Job-level, not step-level: bundler-cache's install and the later
      # `bundle exec jekyll build` step both need to see this, or the
      # build step fails looking for gems that were deliberately skipped.
      BUNDLE_WITHOUT: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Static search index. Runs against the built HTML (after Jekyll, before
      # upload) and writes _site/pagefind/, so results come from our own posts
      # instead of whatever a web crawler happened to index. Version pinned.
      # --force-language builds ONE index for the whole bilingual site so a
      # search from any page returns matches across pt-BR and English posts,
      # rather than being restricted to the current page's language.
      - name: Index with Pagefind
        run: npx -y pagefind@1.5.2 --site _site --force-language pt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
