name: Deploy comments Worker to Cloudflare

# The comment-intake Worker lives in comments-worker/. Redeploy it only when its
# own files change (merging a Dependabot bump, editing the script), so unrelated
# commits to main - blog posts, site tweaks - never touch it. The Worker's own
# auto-published comment commits land in _data/comments/, outside this path, so
# they don't trigger a redeploy either. workflow_dispatch allows a manual run.
on:
  push:
    branches: ["main"]
    paths:
      - "comments-worker/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: comments-worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: comments-worker

      # Deploy with the wrangler from package.json (npm ci above), not the one
      # cloudflare/wrangler-action bundles - the action pins its own wrangler and
      # would fight our pinned version, so a Dependabot bump wouldn't actually
      # take effect. Runtime secrets (GITHUB_TOKEN, TURNSTILE_SECRET, ...) already
      # live in Cloudflare and are untouched by a deploy - only code and vars are
      # uploaded.
      - name: Deploy with Wrangler
        run: npx wrangler deploy
        working-directory: comments-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
