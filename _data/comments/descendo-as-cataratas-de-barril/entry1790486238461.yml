message: "Curiosamente, estou lendo esse post novamente aos 51 anos, ou seja, meio que média entre as duas idades incertas da Annie Edson Taylor. E embora eu não me veja descendo as cataratas de barril, acho que estou bem satisfeito com a energia que tenho hoje (que, em alguns aspectos, até supera a que eu tinha aos 29 anos, quando escrevi esse post)."
