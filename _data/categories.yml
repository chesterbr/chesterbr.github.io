# Source of truth for the blog's categories. Each entry drives the "Categories"
# dropdown (_includes/custom/navigation.html), the reader-language label
# (fed to javascripts/lang_switcher.js via _includes/head.html), and points at
# the category's listing page.
#
# To add a category: add an entry here and tag posts with its `slug` in their
# `categories:` front matter. The listing page at `url` is generated from this
# entry by _plugins/category_pages.rb (layout: _layouts/category.html).
# `description` is the page's meta description; `redirect_from` (optional)
# lists old URLs that should forward to the listing.
#
# Order here doesn't matter for the dropdown — it is sorted alphabetically by
# the displayed (localized) label at render time. This list is kept
# alphabetical by the English label just for readability.
- slug: atari-2600
  url: /blog/categories/atari-2600/
  label:
    en: Atari 2600
    pt: Atari 2600
  description: "Posts about the Atari 2600: homebrew, programming, and hardware for the classic console."
  redirect_from:
    - /atari-2600/
- slug: books
  url: /blog/categories/books/
  label:
    en: Books
    pt: Livros
  description: "Posts about books: reviews, recommendations, and reading notes."
- slug: comics
  url: /blog/categories/comics/
  label:
    en: Comics
    pt: Quadrinhos
  description: "Posts about comics and graphic novels."
- slug: electronics
  url: /blog/categories/electronics/
  label:
    en: Electronics
    pt: Eletrônica
  description: "Posts about electronics: hardware projects, tinkering, and repairs."
- slug: mondo-bizarro
  url: /blog/categories/mondo-bizarro/
  label:
    en: Mondo Bizarro
    pt: Mondo Bizarro
  description: "The odd, funny, and bizarre finds that don't fit anywhere else."
- slug: politics
  url: /blog/categories/politics/
  label:
    en: Politics
    pt: Política
  description: "Elections, parties, and other political musings."
- slug: retrocomputing
  url: /blog/categories/retrocomputing/
  label:
    en: Retrocomputing
    pt: Retrocomputação
  description: "Posts about retrocomputing: vintage machines, emulation, and old-school programming."
  redirect_from:
    - /micros/
    - /micros.html/
- slug: software
  url: /blog/categories/software/
  label:
    en: Software
    pt: Software
  description: "Posts about software: development, tools, and the craft of coding."
- slug: travel
  url: /blog/categories/travel/
  label:
    en: Travel
    pt: Viagens
  description: "Posts about travel: trips, places, and stories from the road."
