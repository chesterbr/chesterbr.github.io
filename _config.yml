# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: chester's blog
email: cd@pobox.com
repository: chesterbr/chesterbr.github.io
author: Chester (Carlos Duarte do Nascimento)
simple_search: //duckduckgo.com
subscribe_rss: /atom.xml
# Used only by jekyll-feed for the Atom/RSS <subtitle>. Previously supplied
# at build time by jekyll-github-metadata (fetched live from this repo's
# GitHub description field via the GitHub API); set statically here instead
# so the build doesn't depend on a live API call.
description: "My blog and personal website, powered by GitHub Pages / Jekyll"
subtitle: >- # this means to ignore newlines until "baseurl:"
  technology, travel, comics, books, math, web, software and ramblings
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://chester.me" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: chesterbr
github_username:  chesterbr

# Default date format is "ordinal" (resulting in "July 22nd 2007")
# You can customize the format as defined in
# http://www.ruby-doc.org/core-1.9.2/Time.html#method-i-strftime
# Additionally, %o will give you the ordinal representation of the day
date_format: "ordinal"

recent_posts: 5       # Posts in the sidebar Recent Posts section
excerpt_link: "Read on &rarr;"  # "Continue reading" link text at the bottom of excerpted articles

# jekyll-paginate-v2 config (replaces old paginate/paginate_path keys;
# legacy compatibility mode was removed in v3.0.0). Reproduces the same
# /blog/, /blog/page2/, /blog/page3/... URL structure as before.
pagination:
  enabled: true
  per_page: 10
  permalink: /page:num/
  sort_field: date
  sort_reverse: true
  # jekyll-paginate-v2 defaults to ':title - page :num' for pages after the
  # first, unlike jekyll-paginate v1 (which never touched page.title at all,
  # so every paginated page rendered with the plain site title). Matching
  # that: no "page N" suffix on any page.
  title: ':title'

excerpt_separator: <!--more-->

titlecase: true       # Converts page and post titles to titlecase

# Build settings
markdown: kramdown
plugins:
  # - jekyll-admin
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-paginate-v2
  - jekyll-sitemap
permalink: /archives/:year/:month/:title/

# Github repositories
github_user: chesterbr
github_repo_count: 5
github_show_profile_link: true
github_skip_forks: true

# Twitter
twitter_user: chesterbr
twitter_tweet_button: false
twitter_follow_button: false

# Facebook Like
facebook_like: false

# Exclude from processing. Setting an explicit `exclude:` replaces (not
# merges with) Jekyll's own defaults, so the defaults are repeated here
# alongside README.md (which was being built into a real, unlinked site
# page — it's meant for GitHub's repo view, not site content).
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md

