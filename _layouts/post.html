---
layout: default
single: true
---

<div>
  <article class="hentry" role="article"{% unless page.robots contains 'noindex' %} data-pagefind-body{% endunless %}>
    {% include article.html %}
    <footer data-pagefind-ignore>
      <p class="meta">
        {% if page.previous.url %}
        <a class="basic-alignment left" href="{{page.previous.url}}"
          title="Previous Post: {{page.previous.title}}">&laquo; {{page.previous.title}}</a>
        {% endif %}
        {% if page.next.url %}
        <a class="basic-alignment right" href="{{page.next.url}}"
          title="Next Post: {{page.next.title}}">{{page.next.title}} &raquo;</a>
        {% endif %}
      </p>
    </footer>
  </article>
  {% unless page.comments == false %}{% include comments.html %}{% endunless %}
</div>

<script>
  // "Read more" links from the listing land here at #more, skipping the intro
  // the reader already saw. Once the browser has positioned them, drop #more
  // from the URL (without scrolling) so a link copied from here opens at the
  // top of the post, not halfway down. Other fragments are left untouched.
  (function () {
    if (window.location.hash !== '#more') return;
    var strip = function () {
      history.replaceState(null, '', window.location.pathname + window.location.search);
    };
    if (document.readyState === 'complete') {
      requestAnimationFrame(strip);
    } else {
      window.addEventListener('load', function () { requestAnimationFrame(strip); });
    }
  })();
</script>
