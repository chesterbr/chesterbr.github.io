<div class="lang-switch-group">
  <span class="lang-switch-label">Posts:</span>
  <div class="lang-switch">
    <a href="#" data-set-lang="en" title="English posts">ENG</a>
    <a href="#" data-set-lang="pt-BR" title="Posts in Portuguese (Brazil)">PORT</a>
    <a href="#" data-set-lang="all" title="All languages / Todos os idiomas"><span data-i18n="langAll">ALL</span></a>
  </div>
</div>
<a class="subscribe-rss" href="{{ site.subscribe_rss }}" rel="subscribe-rss" data-i18n-title="rssTitle" title="subscribe via RSS">
  <i class="fa-solid fa-square-rss" aria-hidden="true"></i>
  <span data-i18n="rss">RSS</span>
</a>
{% if site.subscribe_email %}
<a class="subscribe-email" href="{{ site.subscribe_email }}" rel="subscribe-email" data-i18n-title="emailTitle" title="subscribe via email">
  <i class="fa-solid fa-envelope" aria-hidden="true"></i>
  <span data-i18n="email">Email</span>
</a>
{% endif %}
{% if site.simple_search %}
<div class="search-widget">
  <button type="button" class="search-toggle" aria-label="Search" aria-expanded="false"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></button>
  <form class="search-form" action="{{ site.simple_search }}" method="get">
    <fieldset role="search">
      <input type="hidden" name="sites" value="{{ site.url | shorthand_url }}" />
      <input class="search" type="text" name="q" results="0" data-i18n-placeholder="search" placeholder="Search"/>
    </fieldset>
  </form>
</div>
{% endif %}
{% include custom/navigation.html %}
