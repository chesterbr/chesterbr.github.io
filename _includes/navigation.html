<div class="lang-switch">
  <a href="#" data-set-lang="en" title="English"><span class="fi fi-gb"></span></a>
  <a href="#" data-set-lang="pt-BR" title="Português"><span class="fi fi-br"></span></a>
  <a href="#" data-set-lang="all" title="All languages / Todos os idiomas"><i class="fa-solid fa-globe"></i></a>
</div>
<ul class="subscription" data-subscription="rss{% if site.subscribe_email %} email{% endif %}">
  <li><a href="{{ site.subscribe_rss }}" rel="subscribe-rss" data-i18n="rss" data-i18n-title="rssTitle" title="subscribe via RSS">RSS</a></li>
  {% if site.subscribe_email %}
    <li><a href="{{ site.subscribe_email }}" rel="subscribe-email" data-i18n="email" data-i18n-title="emailTitle" title="subscribe via email">Email</a></li>
  {% endif %}
</ul>
  {% if site.simple_search %}
<form action="{{ site.simple_search }}" method="get">
  <fieldset role="search">
    <input type="hidden" name="sites" value="{{ site.url | shorthand_url }}" />
    <input class="search" type="text" name="q" results="0" data-i18n-placeholder="search" placeholder="Search"/>
  </fieldset>
</form>
  {% endif %}
{% include custom/navigation.html %}
