{% if post.author %}
  {% assign author = post.author %}
{% elsif page.author %}
  {% assign author = page.author %}
{% else %}
  {% assign author = site.author %}
{% endif %}
{% if author %}<span class="byline author vcard"><span data-i18n="postedBy">Posted by</span> <span class="fn">{{ author }}</span></span>{% endif %}
