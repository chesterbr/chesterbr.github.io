<!--Fonts from Google's Web font directory at http://google.com/webfonts -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">

<!-- twitter card and open graph, from http://www.lukaszielinski.de/blog/posts/2013/01/28/twitter-cards-and-open-graph-metatags-in-octopress/ -->
{% comment %} site_name (localized blog name) is assigned in _includes/head.html,
which includes this file. {% endcomment %}

<meta name="twitter:card" content="{% if page.og_image or page.url == '/index.html' %}summary_large_image{% else %}summary{% endif %}">
<meta name="twitter:site" content="@chesterbr">
<meta name="twitter:creator" content="@chesterbr">
<meta name="twitter:title" content="{% if page.title and page.title != site.title %}{{ page.title }} - {% endif %}{{ site_name }}">
<meta name="twitter:url" content="{{ canonical }}">
<meta name="twitter:description" content="{{ description | strip_html | condense_spaces | truncate:150 }}">

<meta property="og:title" content="{% if page.title and page.title != site.title %}{{ page.title }} - {% endif %}{{ site_name }}"/>
{% if page.url == '/index.html' %}
  <meta property="og:image"  content="//chester.me/img/chester_ila_250.jpg" />
  <meta name="twitter:image" content="//chester.me/img/chester_ila_250.jpg" />
{% elsif page.og_image %}
  <meta property="og:image"  content="{% unless page.og_image contains 'http://' or page.og_image contains 'https://' %}{{ site.url }}{% endunless %}{{ page.og_image }}" />
  <meta name="twitter:image" content="{% unless page.og_image contains 'http://' or page.og_image contains 'https://' %}{{ site.url }}{% endunless %}{{ page.og_image }}" />
{% else %}
  <!-- Fallback so pages without their own image still get a preview picture when shared -->
  <meta property="og:image"  content="//chester.me/img/root-profile-photo.jpg" />
  <meta name="twitter:image" content="//chester.me/img/root-profile-photo.jpg" />
{% endif %}
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}"/>
<meta property="og:locale" content="{% if page.locale == 'pt-BR' %}pt_BR{% else %}en_US{% endif %}"/>
<meta property="og:url" content="{{ canonical }}"/>
<meta property="og:site_name" content="{{ site_name }}"/>
<meta property="og:description" content="{{ description | strip_html | condense_spaces | truncate:150 }}"/>
